name: Build Release APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Deps & Python3.10
        run: |
          sudo apt update
          sudo apt install -y python3.10 python3.10-dev python3.10-venv build-essential git libssl-dev autoconf libtool libtool-bin pkg-config zlib1g-dev openjdk-17-jdk unzip autoconf-archive
          sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.10 1
          sudo update-alternatives --set python3 /usr/bin/python3.10

      - name: Build Release
        run: |
          python3.10 -m venv env
          source env/bin/activate
          pip install buildozer cython==0.29.36
          buildozer android release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ReleaseAPK
          path: bin/*.apk
