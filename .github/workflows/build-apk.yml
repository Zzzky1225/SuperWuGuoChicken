name: Build Release APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # 1.官方动作稳定提供Python3.10，保证 python3.10 命令存在！解决 command not found
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 2.官方动作稳定JDK17，解决gradle java版本报错
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git unzip autoconf libtool pkg-config zlib1g-dev

      # 这里全部保留你原来的命令！python3.10 不动！
      - name: Build APK
        run: |
          python3.10 -m venv env
          source env/bin/activate
          pip install buildozer==1.6.0 cython==0.29.36
          buildozer android debug

      - name: Upload built APK
        uses: actions/upload-artifact@v4
        with:
          name: GameAPK
          path: bin/*.apk
