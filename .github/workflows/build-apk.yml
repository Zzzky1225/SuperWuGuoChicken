name: Build Release APK(Docker)
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Clean old cache/output
        run: |
          rm -rf .buildozer bin build __pycache__

      - name: Build APK inside official buildozer docker
        run: |
          docker run --rm \
            -v "$(pwd)":/home/user/hostcwd \
            kivy/buildozer:latest \
            android debug

      - name: Verify so architecture,fail if x86 found
        run: |
          sudo apt install -y binutils
          unzip -q bin/*.apk -d apktmp
          readelf -h apktmp/lib/arm64-v8a/libpython3.so
          if readelf -h apktmp/lib/arm64-v8a/libpython3.so | grep "Intel 80386"; then
            echo "ERROR: x86 so detected inside arm64‑v8a folder!"
            exit 1
          fi

      - name: Upload built APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameAPK
          path: bin/*.apk
