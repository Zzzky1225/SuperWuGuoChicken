name: Build Release APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git unzip autoconf libtool pkg-config zlib1g-dev

      # 【关键1】全部垃圾彻底清空，env虚拟环境一并删除！
      - name: Full Cleanup
        run: |
          rm -rf .buildozer env bin build __pycache__ *.pyc

      # 【关键2】不要创建长期虚拟环境！直接使用用户空间pip，避免环境污染
      - name: Install buildozer globally (user scope)
        run: |
          python3.10 -m pip install --user buildozer==1.6.0 cython==0.29.36
          export PATH=$HOME/.local/bin:$PATH
          buildozer --version

      # 【关键3】独立运行构建，不嵌套在venv内，杜绝复制宿主机x86库
      - name: Build APK
        run: |
          export PATH=$HOME/.local/bin:$PATH
          buildozer android debug

      - name: Upload built APK
        uses: actions/upload-artifact@v4
        with:
          name: GameAPK
          path: bin/*.apk
