name: Build Release APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt update
          sudo apt install -y python3.10 python3.10-venv python3.10-dev build-essential git openjdk-17-jdk unzip autoconf libtool pkg-config zlib1g-dev

      - name: Build
        run: |
          python3.10 -m venv env
          source env/bin/activate
          pip install buildozer==1.5.0 cython==0.29.36
          buildozer android release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk
