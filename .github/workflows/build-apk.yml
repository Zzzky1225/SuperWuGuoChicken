name: Build Game APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Cache Buildozer SDK/NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-sdk-v1

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-v1

      - name: Install system dependencies & Python3.10
        run: |
          sudo apt update
          sudo apt install -y python3-pip build-essential git libssl-dev autoconf libtool libtool-bin pkg-config zlib1g-dev openjdk-17-jdk unzip autoconf-archive
          # 安装3.10，用来匹配目标Python版本
          sudo apt install -y python3.10 python3.10-dev python3.10-venv

      - name: Create Python3.10 venv & install buildozer
        run: |
          python3.10 -m venv ~/py310_env
          source ~/py310_env/bin/activate
          pip install buildozer cython==0.29.36
          echo "source ~/py310_env/bin/activate" >> $GITHUB_ENV

      - name: Build debug APK (Single run, quiet log)
        run: |
          echo y | buildozer android debug --log-level 0

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameAPK
          path: bin/*.apk
