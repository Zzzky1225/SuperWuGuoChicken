name: Build Game APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Cache Buildozer SDK/NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-sdk-v1

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-v1

      - name: Install system dependencies & Python3.10
        run: |
          sudo apt update
          sudo apt install -y python3-pip build-essential git libssl-dev autoconf libtool libtool-bin pkg-config zlib1g-dev openjdk-17-jdk unzip autoconf-archive
          sudo apt install -y python3.10 python3.10-dev python3.10-venv
          # 设置系统默认python3为3.10，消除版本不匹配报错
          sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.10 1
          sudo update-alternatives --set python3 /usr/bin/python3.10

      - name: Create venv, install buildozer, build debug apk
        run: |
          python3.10 -m venv ~/py310_env
          source ~/py310_env/bin/activate
          pip install buildozer cython==0.29.36
          if [ ! -f buildozer.spec ]; then
            buildozer init
          fi
          # 使用venv内python启动buildozer，彻底规避hostpython版本冲突
          echo y | python3 -m buildozer android debug --log-level 2

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameAPK
          path: bin/*.apk
